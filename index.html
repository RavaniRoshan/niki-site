                  "@type": "Answer",

              },

                "@type": "Question",
                "name": "Can each agent use a different model?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Teams can assign provider and model per agent, such as a stronger reasoning model for planning and review and a lower-cost model for testing."
                }
              },

                "@type": "Question",

    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('niki-theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
